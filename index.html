<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnwaSkills — Learn • Earn • Grow</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --green:#087b53;
  --green2:#0ca66f;
  --dark:#09251b;
  --bg:#f5f8f6;
  --white:#fff;
  --text:#10231c;
  --muted:#718078;
  --line:#e2ebe6;
  --gold:#f5b942;
  --shadow:0 12px 35px rgba(15,50,35,.08);
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ================= LOADING SCREEN ================= */

#loadingScreen{
  position:fixed;
  inset:0;
  z-index:99999;
  background:
    radial-gradient(circle at 50% 25%,#13b77b 0,#087b53 35%,#061b14 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  transition:.5s ease;
}

#loadingScreen.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loaderBox{
  width:min(380px,88%);
  text-align:center;
}

.loaderLogo{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:27px;
  display:grid;
  place-items:center;
  background:white;
  color:var(--green);
  font-size:48px;
  font-weight:1000;
  box-shadow:0 20px 60px #0005;
  animation:logoPulse 1.4s infinite alternate;
}

.loaderBrand{
  margin-top:20px;
  font-size:34px;
  font-weight:1000;
  letter-spacing:-1px;
}

.loaderSub{
  margin-top:7px;
  color:#d7f7e9;
  font-size:13px;
  letter-spacing:2px;
}

.loaderLine{
  height:5px;
  background:#ffffff30;
  border-radius:50px;
  overflow:hidden;
  margin-top:30px;
}

.loaderLine span{
  display:block;
  height:100%;
  width:0;
  background:white;
  animation:loadBar 1.7s forwards;
}

@keyframes loadBar{
  to{width:100%}
}

@keyframes logoPulse{
  from{transform:scale(1)}
  to{transform:scale(1.06)}
}

/* ================= NAVBAR ================= */

.nav{
  position:sticky;
  top:0;
  z-index:1000;
  background:#ffffffee;
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

.navInner{
  width:min(1200px,92%);
  margin:auto;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:23px;
  font-weight:1000;
  color:var(--green);
}

.logo span{
  color:var(--dark);
}

.navLinks{
  display:flex;
  gap:25px;
  align-items:center;
}

.navLinks a{
  text-decoration:none;
  color:var(--text);
  font-size:14px;
  font-weight:700;
}

.navLinks a:hover{
  color:var(--green);
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:800;
  font-size:14px;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.primary{
  background:var(--green);
  color:white;
}

.outline{
  background:white;
  color:var(--green);
  border:1px solid #cfe1d9;
}

/* ================= HERO ================= */

.hero{
  padding:85px 0;
  background:
    radial-gradient(circle at 80% 20%,#c9f3df 0,transparent 35%),
    linear-gradient(135deg,#f7fffb,#edf7f2);
}

.container{
  width:min(1200px,92%);
  margin:auto;
}

.heroGrid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:60px;
  align-items:center;
}

.badge{
  display:inline-block;
  padding:8px 13px;
  border-radius:30px;
  background:#dff7eb;
  color:var(--green);
  font-weight:900;
  font-size:12px;
}

.hero h1{
  font-size:clamp(42px,6vw,75px);
  line-height:.98;
  margin:18px 0;
  letter-spacing:-3px;
}

.hero h1 span{
  color:var(--green);
}

.hero p{
  max-width:600px;
  color:var(--muted);
  line-height:1.7;
  font-size:16px;
}

.heroButtons{
  display:flex;
  gap:12px;
  margin-top:28px;
  flex-wrap:wrap;
}

.heroCard{
  background:linear-gradient(145deg,#0b3b2a,#087b53);
  border-radius:30px;
  padding:28px;
  color:white;
  box-shadow:0 25px 60px #087b5330;
}

.heroCardTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.heroA{
  width:55px;
  height:55px;
  border-radius:17px;
  display:grid;
  place-items:center;
  background:white;
  color:var(--green);
  font-size:28px;
  font-weight:1000;
}

.heroAmount{
  font-size:45px;
  font-weight:1000;
  margin:35px 0 5px;
}

.heroSmall{
  color:#c5eadc;
}

/* ================= SECTIONS ================= */

section{
  padding:75px 0;
}

.sectionHead{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:25px;
}

.sectionHead h2{
  font-size:34px;
  letter-spacing:-1px;
}

.sectionHead p{
  color:var(--muted);
  margin-top:6px;
}

/* ================= PACKAGES ================= */

.packageGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.package{
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:.25s;
  position:relative;
}

.package:hover{
  transform:translateY(-7px);
  box-shadow:0 25px 50px #123b2a18;
}

.packageCover{
  height:210px;
  padding:22px;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.learner{
  background:linear-gradient(145deg,#087b53,#06291e);
}

.starter{
  background:linear-gradient(145deg,#1558b0,#071b35);
}

.creator{
  background:linear-gradient(145deg,#743ab6,#241138);
}

.pro{
  background:linear-gradient(145deg,#b66a1c,#3b1d06);
}

.packageBrand{
  font-size:13px;
  font-weight:900;
  letter-spacing:1px;
}

.packageTitle{
  font-size:38px;
  font-weight:1000;
}

.packageBottom{
  font-size:12px;
  opacity:.85;
}

.packageBody{
  padding:19px;
}

.price{
  font-size:30px;
  font-weight:1000;
  margin:7px 0;
}

.packageInfo{
  color:var(--muted);
  font-size:13px;
  margin-bottom:12px;
}

.ebookMini{
  padding:10px;
  border-radius:11px;
  background:#f2f8f5;
  margin-top:7px;
  font-size:12px;
  display:flex;
  gap:8px;
  align-items:center;
}

.packageActions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.packageActions .btn{
  flex:1;
}

.popular{

  top:12px;
  right:12px;
