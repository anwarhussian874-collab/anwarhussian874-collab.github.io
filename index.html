*{
  box-sizing:border-box;
  margin:0;
  padding:0;

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:#f5f7f9;
  color:#17202a;
  line-height:1.5;
}

button,

select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.hidden{
  display:none!important;

/* =========================
   LOADING SCREEN
========================= */

#loadingScreen{
  position:fixed;
  inset:0;
  z-index:99999;
  background:linear-gradient(135deg,#052e16,#166534,#22c55e);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  transition:.5s ease;
}

.loaderBox{
  text-align:center;
  width:90%;
  max-width:380px;
}

.logoCircle{
  width:82px;
  height:82px;
  border-radius:25px;
  background:white;
  color:#16a34a;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 20px;
  font-size:27px;
  font-weight:900;
  box-shadow:0 15px 45px rgba(0,0,0,.2);
}

.loaderBox h1{
  font-size:32px;
  margin-bottom:5px;
}

.loaderBox p{
  opacity:.8;
}

.loaderTrack{
  width:100%;
  height:5px;
  background:rgba(255,255,255,.2);
  border-radius:20px;
  margin-top:25px;
  overflow:hidden;
}

.loaderBar{
  height:100%;
  width:0;
  background:white;
  animation:loading 1.7s ease forwards;
}

@keyframes loading{
  to{width:100%}
}
